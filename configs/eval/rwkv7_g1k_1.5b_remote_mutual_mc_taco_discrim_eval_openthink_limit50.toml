schema_version = 1
backend = "rwkv7-remote"

model_name = "rwkv7-g1k-1.5b"
base_url = "https://api.rwkv.rs/v1/completions"
tokenizer_name = "/home/link/weight/rwkv-g1k-tokenizer/1.5b"
trust_remote_code = true
benchmarks = ["mutual", "mc_taco", "discrim_eval"]
output_dir = "results/rwkv7-g1k-1.5b-remote-mutual-mc_taco-discrim_eval-openthink-limit50"

limit = 50
max_length = 16384
max_num_seqs = 40

apply_chat_template = true
fewshot_as_multiturn = true
log_samples = true

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "open_think"
wkv_mode = "fp32io16"

[checkpoint]
enabled = true
fresh = true

[publication]
enabled = true
base_url = "http://127.0.0.1:7862"
cot_mode = "CoT"
token_env = "SCOREBOARD_PUBLICATION_TOKEN"
rerun_reason = "fix mutual/mc_taco/discrim_eval prompt assembly and scoring (generate_until + yes_no/albatross_mcq extractors)"

[publication.tasks.mutual]
field = "reasoning"

[publication.tasks.mc_taco]
field = "reasoning"

[publication.tasks.discrim_eval]
field = "reasoning"
