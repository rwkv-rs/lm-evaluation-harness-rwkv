# Versioned RWKV evaluation preset. The checkpoint itself is owned by the
# independent vllm-rwkv service; this file selects its exact served model.
schema_version = 1
backend = "rwkv7-http"

model_name = "rwkv7-g1i-1.5b-20260805-ctx16384"
base_url = "http://127.0.0.1:8000/v1/completions"
# The array order is the campaign execution order. These are native
# lm-eval-harness task/group/tag names, resolved directly by TaskManager.
benchmarks = [
  "race",
  "drop",
  "xquad",
  "babilong",
  "infinitebench",
  "ruler",
  "wmdp",
  "cruxeval",
  "inverse_scaling_prize",
  "model_written_evals",
  "humaneval_infilling",
  "mutual",
  "mc_taco",
  "discrim_eval",
  "winogender",
]
output_dir = "results/rwkv7-g1i-1.5b-20260805-ctx16384"

max_length = 16384
batch_size = 1
max_num_seqs = 5
device = "cpu"

apply_chat_template = true
fewshot_as_multiturn = true
log_samples = true
seed = [0, 1234, 1234, 1234]

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "fake_think"
wkv_mode = "fp32io16"
